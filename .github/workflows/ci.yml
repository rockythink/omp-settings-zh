name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify the official Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "omp-windows-x64.exe"
          $version = ([IO.File]::ReadAllText((Join-Path $PWD "package.json")) | ConvertFrom-Json).devDependencies.'@oh-my-pi/pi-coding-agent'
          $base = "https://github.com/can1357/oh-my-pi/releases/download/v$version"
          $binary = Join-Path $env:RUNNER_TEMP "official-omp.exe"
          Invoke-WebRequest "$base/$asset" -OutFile $binary
          $manifest = Join-Path $env:RUNNER_TEMP "official-SHA256SUMS.txt"
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile $manifest
          $checksums = [IO.File]::ReadAllText($manifest, [Text.Encoding]::UTF8)
          $expected = ($checksums -split "`n" | Where-Object { (($_.Trim() -split '\s+')[-1]).TrimStart('*') -eq $asset }) -split '\s+' | Select-Object -First 1
          $actual = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if (!$expected -or $actual -ne $expected.ToLowerInvariant()) { throw "Official OMP checksum mismatch: expected=$expected actual=$actual" }
          Write-Host "Verified official $asset SHA-256: $actual"
          bun run scripts/smoke-cli.ts $binary
          if ($LASTEXITCODE -ne 0) { throw "Native Windows smoke failed" }
